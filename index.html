<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Мой питомец</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);padding:14px;max-width:480px;margin:auto}
  .top{display:flex;justify-content:space-between;font-weight:600}
  #pet{font-size:110px;text-align:center;margin:10px 0;transition:transform .2s}
  #pet.bump{transform:scale(1.2)}
  .bar{margin:6px 0}.bar span{font-size:13px}
  .track{height:12px;background:#8883;border-radius:6px;overflow:hidden}
  .fill{height:100%;border-radius:6px;transition:width .4s}
  .btns{display:flex;gap:8px;margin:12px 0}
  button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-size:15px}
  h3{margin:18px 0 6px}
  .task{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#8881;margin:6px 0}
  .task.done{opacity:.5;text-decoration:line-through}
  .task input{width:20px;height:20px}
  .add{display:flex;gap:8px}.add input{flex:1;padding:10px;border-radius:10px;border:1px solid #8886;font-size:15px}
  .add button{flex:0 0 50px}
  #msg{text-align:center;min-height:20px;font-size:14px}
</style>
</head>
<body>
<div class="top"><div id="lvl"></div><div id="streak"></div><div id="coins"></div></div>
<div id="pet">🐱</div>
<div id="msg"></div>
<div class="bar"><span>🍖 Сытость</span><div class="track"><div class="fill" id="b_hunger" style="background:#f59e0b"></div></div></div>
<div class="bar"><span>😊 Настроение</span><div class="track"><div class="fill" id="b_mood" style="background:#ec4899"></div></div></div>
<div class="bar"><span>⚡ Энергия</span><div class="track"><div class="fill" id="b_energy" style="background:#22c55e"></div></div></div>
<div class="btns">
  <button onclick="act('feed')">Покормить (5🪙)</button>
  <button onclick="act('play')">Играть</button>
  <button onclick="act('sleep')">Спать</button>
</div>
<h3>Задачи на сегодня</h3>
<div id="tasks"></div>
<div class="add"><input id="newTask" placeholder="Своя привычка..."><button onclick="addTask()">+</button></div>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const KEY='pet_v1';
const today=()=>new Date().toISOString().slice(0,10);
const def={hunger:80,mood:80,energy:80,coins:10,xp:0,streak:0,lastDay:today(),allDone:false,lastTick:Date.now(),
 tasks:[{id:1,text:'Выпить воды',done:false},{id:2,text:'Зарядка',done:false},{id:3,text:'Почитать 10 минут',done:false}]};
let s=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'));
const clamp=v=>Math.max(0,Math.min(100,v));

function tick(){
  const min=(Date.now()-s.lastTick)/60000; s.lastTick=Date.now();
  s.hunger=clamp(s.hunger-min*0.2); s.mood=clamp(s.mood-min*0.15); s.energy=clamp(s.energy-min*0.1);
  if(s.lastDay!==today()){
    if(!s.allDone) s.streak=0;
    s.tasks.forEach(t=>t.done=false); s.allDone=false; s.lastDay=today();
  }
}
function save(){localStorage.setItem(KEY,JSON.stringify(s));}
function say(t){document.getElementById('msg').textContent=t;}
function bump(){const p=document.getElementById('pet');p.classList.add('bump');setTimeout(()=>p.classList.remove('bump'),200);}
function level(){return Math.floor(s.xp/50)+1;}
function face(){
  const l=level(); let e=l<2?'🥚':l<3?'🐣':l<5?'🐱':'🦁';
  if(l>=2 && (s.hunger<20||s.energy<15)) e='😿';
  return e;
}
function act(a){
  tick();
  if(a==='feed'){ if(s.coins<5) return say('Не хватает монет — выполни задачи!'); s.coins-=5; s.hunger=clamp(s.hunger+25); say('Ням-ням!'); }
  if(a==='play'){ if(s.energy<10) return say('Питомец устал, пусть поспит'); s.mood=clamp(s.mood+20); s.energy=clamp(s.energy-10); s.xp+=2; say('Весело!'); }
  if(a==='sleep'){ s.energy=clamp(s.energy+30); say('Zzz...'); }
  bump(); tg?.HapticFeedback?.impactOccurred('light'); render();
}
function toggle(id){
  tick(); const t=s.tasks.find(x=>x.id===id); if(t.done) return;
  t.done=true; s.coins+=10; s.xp+=10; s.mood=clamp(s.mood+5);
  if(!s.allDone && s.tasks.every(x=>x.done)){
    s.allDone=true; s.streak++; const b=Math.min(s.streak,7)*5; s.coins+=b; say('Все задачи! Стрик '+s.streak+', бонус +'+b+'🪙');
  } else say('+10🪙 +10 опыта');
  bump(); tg?.HapticFeedback?.notificationOccurred('success'); render();
}
function addTask(){
  const i=document.getElementById('newTask'); const v=i.value.trim(); if(!v) return;
  s.tasks.push({id:Date.now(),text:v,done:false}); i.value=''; render();
}
function render(){
  save();
  document.getElementById('pet').textContent=face();
  document.getElementById('lvl').textContent='Ур. '+level();
  document.getElementById('streak').textContent='🔥 '+s.streak;
  document.getElementById('coins').textContent='🪙 '+s.coins;
  ['hunger','mood','energy'].forEach(k=>document.getElementById('b_'+k).style.width=s[k]+'%');
  document.getElementById('tasks').innerHTML=s.tasks.map(t=>
    `<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked disabled':''} onchange="toggle(${t.id})">${t.text}</label>`).join('');
}
tick(); render(); setInterval(()=>{tick();render();},30000);
</script>
</body>
</html>
